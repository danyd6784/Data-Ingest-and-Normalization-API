<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Document</title>
    </head>
    <body>
        <h1>Upload File</h1>
        <form method="post" action="http://localhost:3000/api/ingest">
            <input
                type="file"
                name="inputFile"
                id="inputFile"
                accept=".csv,.json,.xml"
            />
            <input type="submit" value="Submit" />
        </form>
    </body>
</html>
